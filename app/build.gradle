plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// CI passes -PappVersionCode / -PappVersionName. Local builds fall back to 1 / "1.0".
def appVersionCode = (project.findProperty("appVersionCode") ?: "1").toString().toInteger()
def appVersionName = (project.findProperty("appVersionName") ?: "1.0").toString()

android {
    namespace 'com.sustainment.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.sustainment.launcher"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}